<svg viewBox="0 0 480 580" width="480" height="580" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a Mexa Motion creative editor wearing headphones and reviewing a video timeline on a tablet">
  <defs>
    <linearGradient id="mxHoodie" x1="240" y1="380" x2="240" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C93FF"/>
      <stop offset="45%" stop-color="#1152DF"/>
      <stop offset="100%" stop-color="#0B3AA6"/>
    </linearGradient>
    <linearGradient id="mxSkin" x1="200" y1="120" x2="290" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3BC95"/>
      <stop offset="100%" stop-color="#E09B6C"/>
    </linearGradient>
    <linearGradient id="mxScreen" x1="150" y1="430" x2="330" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D43B4"/>
      <stop offset="100%" stop-color="#2C6DE6"/>
    </linearGradient>
    <linearGradient id="mxHair" x1="170" y1="100" x2="320" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2438"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="mxBand" x1="150" y1="100" x2="330" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7E0EE"/>
    </linearGradient>
    <linearGradient id="mxFadeGrad" x1="0" y1="532" x2="0" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="mxTorsoFade" maskUnits="userSpaceOnUse" x="0" y="0" width="480" height="580">
      <rect x="0" y="0" width="480" height="532" fill="#FFFFFF"/>
      <rect x="0" y="532" width="480" height="48" fill="url(#mxFadeGrad)"/>
    </mask>
  </defs>

  <!-- ── Hair (behind head) ─────────────────────────────────────────── -->
  <path d="M150 262 C140 168 178 92 240 92 C302 92 340 168 330 262 C328 276 318 280 310 272 L170 272 C162 280 152 276 150 262 Z"
        fill="url(#mxHair)"/>

  <!-- ── Ears ───────────────────────────────────────────────────────── -->
  <path d="M166 202 C152 197 142 208 147 223 C152 238 164 245 171 238 Z" fill="#E09B6C"/>
  <path d="M314 202 C328 197 338 208 333 223 C328 238 316 245 309 238 Z" fill="#E09B6C"/>

  <!-- ── Neck (extends into the torso so the head never floats) ─────── -->
  <path d="M217 272 L263 272 L263 392 L217 392 Z" fill="#D9905F"/>

  <!-- ── Head ───────────────────────────────────────────────────────── -->
  <path d="M240 116 C290 116 318 158 318 210 C318 266 286 304 240 304 C194 304 162 266 162 210 C162 158 190 116 240 116 Z"
        fill="url(#mxSkin)"/>

  <!-- ── Hair (front sweep) ─────────────────────────────────────────── -->
  <path d="M163 200 C166 138 198 106 240 106 C284 106 314 138 317 200 C307 170 288 152 259 149 C234 147 208 156 188 177 C178 187 169 196 163 200 Z"
        fill="url(#mxHair)"/>

  <!-- ── Eyebrows ───────────────────────────────────────────────────── -->
  <path d="M194 208 C202 201 216 201 225 207" stroke="#12182B" stroke-width="5" stroke-linecap="round"/>
  <path d="M255 207 C264 201 278 201 286 208" stroke="#12182B" stroke-width="5" stroke-linecap="round"/>

  <!-- ── Eyes ───────────────────────────────────────────────────────── -->
  <ellipse cx="210" cy="227" rx="7.5" ry="9.5" fill="#12182B"/>
  <ellipse cx="270" cy="227" rx="7.5" ry="9.5" fill="#12182B"/>
  <circle cx="212.5" cy="223.5" r="2.6" fill="#FFFFFF"/>
  <circle cx="272.5" cy="223.5" r="2.6" fill="#FFFFFF"/>

  <!-- ── Nose + mouth ───────────────────────────────────────────────── -->
  <path d="M240 236 C245 245 247 251 240 255" stroke="#C97F52" stroke-width="4" stroke-linecap="round"/>
  <path d="M222 270 C232 281 248 281 258 270" stroke="#B5664A" stroke-width="4.5" stroke-linecap="round"/>

  <!-- ── Headphones ─────────────────────────────────────────────────── -->
  <path d="M152 214 C152 128 192 90 240 90 C288 90 328 128 328 214"
        stroke="url(#mxBand)" stroke-width="17" stroke-linecap="round"/>
  <path d="M152 214 C152 128 192 90 240 90 C288 90 328 128 328 214"
        stroke="#1152DF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <rect x="133" y="190" width="45" height="68" rx="21" fill="#1152DF"/>
  <rect x="302" y="190" width="45" height="68" rx="21" fill="#1152DF"/>
  <rect x="142" y="199" width="27" height="50" rx="13.5" fill="#3B82F6" opacity="0.9"/>
  <rect x="311" y="199" width="27" height="50" rx="13.5" fill="#3B82F6" opacity="0.9"/>
  <path d="M156 194 C161 232 161 248 156 258" stroke="#8FC0FF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M324 194 C319 232 319 248 324 258" stroke="#8FC0FF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <g mask="url(#mxTorsoFade)">
  <!-- ── Torso (hoodie) ─────────────────────────────────────────────── -->
  <path d="M104 580 C104 476 126 394 152 354 C168 344 206 338 240 338 C274 338 312 344 328 354 C354 394 376 476 376 580 Z"
        fill="url(#mxHoodie)"/>

  <!-- Collar -->
  <path d="M202 348 C214 368 266 368 278 348" stroke="#0B3AA6" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Zip + drawstrings -->
  <path d="M240 362 L240 580" stroke="#0B3AA6" stroke-width="3.5" opacity="0.75"/>
  <path d="M226 356 C220 378 218 398 220 416" stroke="#BFD9FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M254 356 C260 378 262 398 260 416" stroke="#BFD9FF" stroke-width="4" stroke-linecap="round"/>

  <!-- ── Forearms reaching in to the tablet ─────────────────────────── -->
  <path d="M126 430 C122 468 136 496 158 514" stroke="url(#mxHoodie)" stroke-width="38" stroke-linecap="round"/>
  <path d="M354 430 C358 468 344 496 322 514" stroke="url(#mxHoodie)" stroke-width="38" stroke-linecap="round"/>
  </g>

  <!-- ── Tablet with video timeline ─────────────────────────────────── -->
  <rect x="152" y="424" width="176" height="116" rx="13" fill="#0B1220"/>
  <rect x="163" y="435" width="154" height="58" rx="7" fill="url(#mxScreen)"/>
  <path d="M234 449 L264 464 L234 479 Z" fill="#FFFFFF" opacity="0.95"/>
  <rect x="171" y="444" width="28" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
  <rect x="171" y="455" width="44" height="6" rx="3" fill="#FFFFFF" opacity="0.35"/>
  <rect x="165" y="504" width="150" height="8" rx="4" fill="#1B2740"/>
  <rect x="165" y="504" width="56" height="8" rx="4" fill="#3B82F6"/>
  <rect x="227" y="504" width="38" height="8" rx="4" fill="#8FC0FF"/>
  <rect x="271" y="504" width="42" height="8" rx="4" fill="#1152DF"/>
  <path d="M197 496 L197 520" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <rect x="152" y="424" width="176" height="116" rx="13" stroke="#8FC0FF" stroke-width="2.5" opacity="0.55"/>

  <!-- ── Hands gripping the tablet (drawn over the edge) ────────────── -->
  <g>
    <rect x="132" y="492" width="46" height="58" rx="19" fill="#E09B6C"/>
    <rect x="302" y="492" width="46" height="58" rx="19" fill="#E09B6C"/>
    <rect x="150" y="500" width="34" height="15" rx="7.5" fill="#F3BC95"/>
    <rect x="150" y="520" width="34" height="15" rx="7.5" fill="#F3BC95"/>
    <rect x="296" y="500" width="34" height="15" rx="7.5" fill="#F3BC95"/>
    <rect x="296" y="520" width="34" height="15" rx="7.5" fill="#F3BC95"/>
  </g>

  <!-- ── Rim light ──────────────────────────────────────────────────── -->
  <path d="M170 122 C178 158 170 240 174 266" stroke="#BFD9FF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M112 522 C108 480 118 428 144 398" stroke="#BFD9FF" stroke-width="4" stroke-linecap="round" opacity="0.28"/>
</svg>
